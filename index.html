<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Steady — safe to spend</title>
<meta name="description" content="A financial copilot for irregular income: one safe-to-spend number, and it acts before you overdraft.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand"><span class="logo" aria-hidden="true"></span><h1>Steady</h1></div>
  <div class="accounts">
    <div class="acct"><span>Checking</span><b id="acctCh">$0</b></div>
    <div class="acct"><span>Savings</span><b id="acctSv">$0</b></div>
    <span id="mode" class="pill"></span>
  </div>
</header>

<main class="layout">
  <div class="col">
    <section class="hero" aria-live="polite">
      <p class="label">Safe to spend today</p>
      <p class="big" id="safe">$0</p>
      <p class="sub">after taxes and bills, until your next payment</p>
      <div class="buckets" id="buckets"></div>
    </section>

    <section class="card alert" id="alert" hidden>
      <div class="alert-head"><span class="dot" aria-hidden="true"></span><p class="label" id="alertLabel">Heads up</p></div>
      <p id="alertText" class="alert-text"></p>
      <p id="alertSub" class="alert-sub"></p>
      <button id="prevent">Prevent it</button>
      <p id="done" class="done" hidden></p>
    </section>

    <section class="card healthcard"><p class="label">Financial health</p><div class="health" id="health"></div></section>

    <section class="card activitycard"><p class="label">Activity</p><ul class="activity" id="activity"></ul></section>
  </div>

  <div class="col">
    <section class="card chartcard">
      <div class="row"><p class="label">Balance forecast · 45 days</p>
        <p class="legend"><i class="l-line"></i>Expected <i class="l-band"></i>Range <i class="l-bill"></i>Bill <i class="l-in"></i>Payment</p></div>
      <canvas id="chart" aria-label="Forecast of your checking balance over 45 days"></canvas>
      <label class="sim">
        <span>What if your client pays <b id="lateVal">0</b> weeks late?</span>
        <input type="range" id="late" min="0" max="6" value="0">
      </label>
    </section>

    <section class="card coachcard"><p class="label">Coach</p>
      <form id="askForm"><input id="q" placeholder="Can I afford a $200 lens?" autocomplete="off"><button>Ask</button></form>
      <div id="answer"></div></section>
  </div>
</main>
<footer>Built for HackUTD · Capital One Nessie · Claude Haiku</footer>
<script src="app.js"></script>
</body>
</html>
